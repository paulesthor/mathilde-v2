name: Debug — Check Site Content Snapshot

# Vérification ponctuelle : confirme que le nouvel instantané de contenu
# (site_content) injecté dans index.html au moment du build contient bien
# de vraies données Supabase, et pas un tableau vide de repli.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la page en ligne et extraire l'instantané
        run: |
          curl -sL "https://paulesthor.github.io/mathilde-v2/?cachebust=$(date +%s)" -o page.html
          echo "--- Taille du fichier récupéré ---"
          wc -c page.html
          echo "--- Contient __SITE_CONTENT__ ? ---"
          grep -c "__SITE_CONTENT__" page.html || echo "0 (absent)"
          echo "--- Contexte autour de __SITE_CONTENT__ (si présent) ---"
          grep -o '.\{0,80\}__SITE_CONTENT__.\{0,4000\}' page.html || echo "(rien trouvé)"
          echo "--- Premières lignes du head ---"
          head -c 1500 page.html
