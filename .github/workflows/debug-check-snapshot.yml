name: Debug — Check Site Content Snapshot

# Vérification ponctuelle : confirme que le nouvel instantané de contenu
# (site_content) injecté dans index.html au moment du build contient bien
# de vraies données Supabase, et pas un tableau vide de repli.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la page en ligne et extraire l'instantané
        run: |
          curl -s "https://paulesthor.github.io/mathilde-v2/?cachebust=$(date +%s)" -o page.html
          echo "--- Script tag brut ---"
          grep -o '<script id="__SITE_CONTENT__"[^>]*>.*</script>' page.html | head -c 4000
          echo ""
          echo "--- Longueur totale du contenu JSON ---"
          grep -o '<script id="__SITE_CONTENT__"[^>]*>.*</script>' page.html | wc -c
