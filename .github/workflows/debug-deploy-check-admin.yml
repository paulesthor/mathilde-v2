name: Debug - Deploy temporaire de verification ADMIN_EMAILS

on:
  workflow_dispatch:
    inputs:
      debug_token:
        description: "Jeton temporaire choisi pour ce test"
        required: true
        type: string

jobs:
  deploy-and-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Definir le jeton de debug temporaire
        run: supabase secrets set DEBUG_CHECK_TOKEN="$DEBUG_TOKEN" --project-ref dekmujrzeverlmnzjzbh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEBUG_TOKEN: ${{ inputs.debug_token }}

      - name: Deploy debug-check-admin-emails
        run: supabase functions deploy debug-check-admin-emails --project-ref dekmujrzeverlmnzjzbh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Appeler la fonction avec le jeton de debug
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" --max-time 15 \
            "$SUPA_URL/functions/v1/debug-check-admin-emails" \
            -H "Authorization: Bearer $DEBUG_TOKEN"
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL }}
          DEBUG_TOKEN: ${{ inputs.debug_token }}
