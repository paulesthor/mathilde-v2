name: Debug — Applique les correctifs sécurité (usage unique)

# Workflow temporaire : applique en une fois les correctifs identifiés par
# l'audit sécurité du 2026-09-09, via l'API Management de Supabase.
# Utilise le secret SUPABASE_ACCESS_TOKEN du dépôt (déjà utilisé par
# run-sql.yml / deploy-supabase-functions.yml) — mets-le à jour dans
# Settings > Secrets and variables > Actions avant de lancer ce workflow.
# 1. Liste les comptes admin existants (pour ADMIN_EMAILS, sans en oublier).
# (L'inscription publique a déjà été désactivée manuellement par la cliente.)
# 2. Exécute la migration SQL (policy de lecture "products" durcie).
# 3. Configure le secret ADMIN_EMAILS pour les Edge Functions.
# 4. Redéploie les 3 fonctions modifiées (send-push, create-stripe-link,
#    update-product).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 1. Liste les comptes admin existants (auth.users)
        id: list_users
        run: |
          SQL_JSON=$(jq -Rs . <<< "SELECT email FROM auth.users ORDER BY created_at;")
          RESPONSE=$(curl -sS -X POST \
            "https://api.supabase.com/v1/projects/dekmujrzeverlmnzjzbh/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL_JSON}")
          echo "$RESPONSE"
          EMAILS=$(echo "$RESPONSE" | jq -r '[.[].email] | join(",")')
          echo "Comptes trouvés : $EMAILS"
          echo "emails=$EMAILS" >> "$GITHUB_OUTPUT"

      - name: 2. Exécute la migration SQL (durcissement RLS products)
        run: |
          SQL_JSON=$(jq -Rs . < supabase/deploy_all.sql)
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/dekmujrzeverlmnzjzbh/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL_JSON}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::Échec de la migration SQL (HTTP $STATUS)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 3. Configure ADMIN_EMAILS pour les Edge Functions
        run: |
          supabase secrets set ADMIN_EMAILS="${{ steps.list_users.outputs.emails }}" --project-ref dekmujrzeverlmnzjzbh

      - name: 4. Redéploie les fonctions modifiées
        run: |
          for fn in send-push create-stripe-link update-product; do
            echo "=== Deploying $fn ==="
            supabase functions deploy "$fn" --project-ref dekmujrzeverlmnzjzbh
          done
