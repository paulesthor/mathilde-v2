name: Debug - Nettoyage de la fonction de diagnostic

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supprimer la fonction debug-check-admin-emails
        run: supabase functions delete debug-check-admin-emails --project-ref dekmujrzeverlmnzjzbh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Retirer le secret DEBUG_CHECK_TOKEN
        run: supabase secrets unset DEBUG_CHECK_TOKEN --project-ref dekmujrzeverlmnzjzbh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
