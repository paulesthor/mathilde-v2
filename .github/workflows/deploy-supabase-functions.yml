name: Deploy Supabase Backend (migrations + bucket + functions)

# Déclenchement manuel uniquement, depuis l'onglet Actions du repo
# (bouton "Run workflow") — aucun déploiement automatique à chaque push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Applique toutes les migrations SQL (tables, colonnes, policies) via
      # l'API Management de Supabase, en réutilisant le même token que pour
      # le déploiement des fonctions (pas besoin du mot de passe de la base).
      # Crée aussi le bucket de stockage "products" (public en lecture),
      # un bucket Supabase Storage n'étant qu'une ligne dans storage.buckets.
      - name: Appliquer les migrations SQL + créer le bucket "products"
        run: |
          SQL_JSON=$(jq -Rs . < supabase/deploy_all.sql)
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/dekmujrzeverlmnzjzbh/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $SQL_JSON}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::Échec de l'application des migrations (HTTP $STATUS)"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Appelée directement par Stripe (pas par notre frontend) : Stripe n'envoie
      # pas de clé Supabase, donc la vérification JWT par défaut bloquerait la
      # requête avant même qu'elle atteigne notre code. La sécurité y est déjà
      # assurée autrement, par la vérification de signature Stripe dans le code.
      - name: Deploy stripe-webhook (sans vérification JWT)
        run: supabase functions deploy stripe-webhook --project-ref dekmujrzeverlmnzjzbh --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy des autres fonctions
        run: |
          for fn in create-stripe-link get-checkout-session send-contact-email send-push submit-review update-product; do
            echo "=== Deploying $fn ==="
            supabase functions deploy "$fn" --project-ref dekmujrzeverlmnzjzbh
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
