name: Deploy Supabase Edge Functions

# Déclenchement manuel uniquement, depuis l'onglet Actions du repo
# (bouton "Run workflow") — aucun déploiement automatique à chaque push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Appelée directement par Stripe (pas par notre frontend) : Stripe n'envoie
      # pas de clé Supabase, donc la vérification JWT par défaut bloquerait la
      # requête avant même qu'elle atteigne notre code. La sécurité y est déjà
      # assurée autrement, par la vérification de signature Stripe dans le code.
      - name: Deploy stripe-webhook (sans vérification JWT)
        run: supabase functions deploy stripe-webhook --project-ref dekmujrzeverlmnzjzbh --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy des autres fonctions
        run: |
          for fn in create-stripe-link get-checkout-session send-contact-email send-push submit-review update-product; do
            echo "=== Deploying $fn ==="
            supabase functions deploy "$fn" --project-ref dekmujrzeverlmnzjzbh
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
