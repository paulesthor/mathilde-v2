name: Debug - Diagnostic connexion Supabase

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Statut du projet via l API Management
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" --max-time 15 "https://api.supabase.com/v1/projects" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o projects.json
          echo "--- raw body ---"
          cat projects.json
          echo "--- parsed (if array) ---"
          jq '.[] | select(.id == "dekmujrzeverlmnzjzbh")' projects.json || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 2. Test REST direct avec la cle anon actuelle
        if: always()
        run: |
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" --max-time 15 \
            "$SUPA_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY"
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
