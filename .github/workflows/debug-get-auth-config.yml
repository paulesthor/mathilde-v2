name: Debug - Lire la configuration Auth (rate limits)

on:
  workflow_dispatch:

jobs:
  read-config:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la config Auth du projet
        run: |
          curl -sS --max-time 15 "https://api.supabase.com/v1/projects/dekmujrzeverlmnzjzbh/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o auth_config.json
          echo "--- Champs contenant rate/limit/captcha/signup ---"
          jq 'to_entries | map(select(.key | test("rate|limit|captcha|signup"; "i"))) | from_entries' auth_config.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
