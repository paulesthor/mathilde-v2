 {"id":"f3c9f81e-8be3-48e1-ac03-d073d8e6c9ca","page":"realisations","section":"item","kind":"list_item","title":"Pièces sans fin","text_value":"J'aime recevoir mes amis et ma famille. Très vite, le cercle des convives s'agrandit et les places viennent à manquer autour de la table basse. L'idée de la colonne de tabourets empilables est née : à l'arrivée des invités, il suffit de les descendre pour que chacun trouve sa place. Ces tabourets sont habillés de tissus aux couleurs vives. Les motifs qui les ornent sont obtenus par un jeu d'empiècements textiles. Une fois les invités repartis, les tabourets reprennent leur forme sculpturale. Empilés en colonne, ils évoquent la Colonne sans fin de Constantin Brancusi. Pour ce projet sur le thème de l'Art Déco, j'ai choisi de m'éloigner des modèles existants pour concevoir un meuble original, modulable et pensé pour s'adapter aux petits espaces.","image_url":null,"extra":{"details": ["Structure bois par Victor Chastant", "Tissu Highlander (Clarke & Clarke)", "Découpe laser au Miiido de Bliiida"]},"sort_order":0}, 
 {"id":"64ff6a4e-edf8-464c-a9cc-251e45d19e81","page":"realisations","section":"item","kind":"list_item","title":"Bridge Allison","text_value":"J'adore les audacieux qui mettent leurs mains devant les yeux, ceux qui doutent, mais qui se jettent quand même à l'eau. Ceux qui ont peur de se tromper, mais qui se disent YOLO. On a des points communs, c'est sûrement pour ça qu'ils me font confiance. Un jour, la propriétaire de ce bridge a osé. Vraiment osé : une belle serviette de bain, une agrafeuse de bureau… et hop, fauteuil retapissé. Le résultat n'était pas si mal, mais ce beau bridge méritait mieux. Adieu la serviette de plage : aujourd'hui, il se pare de ce superbe tissu au style Memphis, pile à la hauteur de son audace ✨","image_url":null,"extra":{"details": ["Style Memphis rétro et graphique", "Tissu Odyssée de chez Camengo", "Structure bois restaurée"]},"sort_order":1}, 
 {"id":"c975a303-62ed-4a4d-acf1-409ab40a3807","page":"realisations","section":"item","kind":"list_item","title":"Bridges Pauline","text_value":"Le léopard, on en voit partout… Réveillez le tigre qui est en vous ! Restauration de fauteuils vintage avec réfection complète et tissu ultra coloré. Le bois a été conservé, l'assise a été refaite, et surtout ce tissu complètement fou de chez Clarke&Clarke transforme ces fauteuils en véritables pièces de décoration fortes.","image_url":null,"extra":{"details": ["Assises refaites à neuf", "Tissu graphique Clarke & Clarke", "Structure en bois conservée et sublimée"]},"sort_order":2}, 
 {"id":"47da4b0b-2818-4242-be72-6db740cf4bf2","page":"creations","section":"item","kind":"list_item","title":"Coussin Plissé","text_value":"Coussin décoratif réalisé avec un plissé main technique. Une exploration des volumes textiles.","image_url":"https://images.unsplash.com/photo-1574044199960-4fed290d2fd2?auto=format&fit=crop&q=80&w=1000","extra":{"details": ["Velours de coton", "Plissé fait main"]},"sort_order":0}, 
 {"id":"fcd0e338-edd3-44b8-8f53-5ac27260e883","page":"creations","section":"item","kind":"list_item","title":"Tête de Lit 'Aube'","text_value":"Création sur-mesure d'une tête de lit capitonnée, pensée pour s'intégrer parfaitement dans une chambre aux tons minéraux.","image_url":"https://images.unsplash.com/photo-1505693314120-0d443867891c?auto=format&fit=crop&q=80&w=1000","extra":{"details": ["Lin lavé froissé", "Capitonnage diamant"]},"sort_order":1}, 
 {"id":"9a8552cc-e089-4b00-bd31-5c81acff2f1f","page":"creations","section":"item","kind":"list_item","title":"Banette de Fenêtre","text_value":"Aménagement d'une alcôve avec des coussins sur-mesure pour créer un coin lecture lumineux et graphique.","image_url":"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&q=80&w=1000","extra":{"details": ["Laine bouillie", "Sur-mesure total"]},"sort_order":2}, 
 {"id":"6cebe4fd-bf61-48f1-9b25-019ac9a21a2f","page":"prestations","section":"item","kind":"list_item","title":"Rénovation de sièges","text_value":"Redonnez vie à vos assises anciennes ou abîmées. De la réfection complète en crin végétal à la couverture simple, chaque projet est étudié pour respecter l'histoire du meuble tout en l'adaptant à votre intérieur actuel.","image_url":null,"extra":{"details": ["Diagnostic et devis personnalisé", "Dégarnissage et mise à nu de la carcasse", "Restauration des fûts", "Garniture traditionnelle ou contemporaine"]},"sort_order":0}, 
 {"id":"10005b84-af38-4b04-b277-3ce58180b9cd","page":"prestations","section":"item","kind":"list_item","title":"Rideaux & Voilages","text_value":"Habillez vos fenêtres sur-mesure pour créer une atmosphère unique, filtrer la lumière ou isoler vos pièces. Confection artisanale selon les règles de l'art.","image_url":null,"extra":{"details": ["Prise de mesures à domicile", "Conseil dans le choix des textiles", "Confection sur-mesure", "Différentes finitions de têtes"]},"sort_order":1},
